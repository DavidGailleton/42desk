# {{MARK}}
# The backend is chosen by 42desk-rice-apply: glx, or xrender if glx fails.
vsync = true;
use-damage = true;

corner-radius = {{RADIUS}};
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
];

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "_GTK_FRAME_EXTENTS@",
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;

wintypes: {
    tooltip = { fade = true; shadow = false; };
    dropdown_menu = { shadow = false; };
    popup_menu = { shadow = false; };
};

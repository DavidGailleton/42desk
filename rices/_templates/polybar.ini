; {{MARK}}
[colors]
bg = {{BG}}
bg-alt = {{BG_ALT}}
fg = {{FG}}
dim = {{FG_DIM}}
accent = {{ACCENT}}
urgent = {{URGENT}}

[bar/main]
monitor = ${env:MONITOR:}
bottom = {{BAR_BOTTOM}}
width = 100%
height = 28
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2
padding-left = 1
padding-right = 2
module-margin = 1
separator = |
separator-foreground = ${colors.dim}
font-0 = {{FONT}}:size={{FONT_SIZE_SMALL}};2
font-1 = Symbols Nerd Font Mono:size={{FONT_SIZE}};3
modules-left = {{WM_MODULE}} xwindow
modules-right = pulseaudio memory cpu date tray rice lock
cursor-click = pointer
enable-ipc = true
wm-restack = {{WM_MODULE}}

[module/i3]
type = internal/i3
pin-workspaces = true
format = <label-state> <label-mode>
label-mode-background = ${colors.urgent}
label-mode-padding = 1
label-focused = %name%
label-focused-background = ${colors.bg-alt}
label-focused-underline = ${colors.accent}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-padding = 1
label-visible = %name%
label-visible-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.urgent}
label-urgent-padding = 1

[module/bspwm]
type = internal/bspwm
label-focused = %name%
label-focused-background = ${colors.bg-alt}
label-focused-underline = ${colors.accent}
label-focused-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.urgent}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.dim}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.accent}
label-muted = muted
label-muted-foreground = ${colors.dim}
click-right = pavucontrol

[module/memory]
type = internal/memory
interval = 3
format-prefix = "RAM "
format-prefix-foreground = ${colors.accent}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 3
format-prefix = "CPU "
format-prefix-foreground = ${colors.accent}
label = %percentage:2%%

[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
label = %date%  %time%

[module/tray]
type = internal/tray
tray-spacing = 8px

; Click: rofi rice picker (Super+Shift+T).
[module/rice]
type = custom/text
format = 
format-foreground = ${colors.accent}
click-left = 42desk-rice-pick &

; Click: the 42 lock, through the host (Ctrl+Alt+L).
[module/lock]
type = custom/text
format = 
format-foreground = ${colors.accent}
click-left = ft_lock &

[settings]
screenchange-reload = true

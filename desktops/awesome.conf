# shellcheck shell=bash disable=SC2034
NAME="awesome"
DESC="dynamic window manager configured in Lua"
PACKAGES=(awesome)
START="awesome"

# stock_config <rootfs>: awesome's default rc.lua, plus the 42 keys (its layout
# keys move to Super+Alt+Space).
stock_config() {
    local dst=$HOME/.config/awesome/rc.lua
    [[ -e $dst ]] && return 0
    mkdir -p "$(dirname "$dst")"
    sed -e 's/^terminal = "xterm"/terminal = "x-terminal-emulator"/' "${AWESOME_KEYS_SED[@]}" \
        "$1/etc/xdg/awesome/rc.lua" >"$dst"
    grep -qF "$AWESOME_KEYS_CHECK" "$dst" || warn "awesome's Super+Space layout key was not found: it stays"
    cat >>"$dst" <<'LUA'

-- 42 lock screen, back to GNOME, app search, next keyboard layout
root.keys(gears.table.join(root.keys(),
    awful.key({ "Control", "Mod1" }, "l", function() awful.spawn("ft_lock") end,
        { description = "lock screen", group = "42" }),
    awful.key({ modkey }, "b", function() awesome.quit() end,
        { description = "back to GNOME", group = "42" }),
    awful.key({ modkey }, "space", function() awful.spawn("rofi -show drun") end,
        { description = "app search", group = "42" }),
    awful.key({ modkey, "Shift" }, "space", function() awful.spawn("42desk-kbd-next") end,
        { description = "next keyboard layout", group = "42" })))
LUA
}

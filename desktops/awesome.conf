# shellcheck shell=bash disable=SC2034
NAME="awesome"
DESC="dynamic window manager configured in Lua"
PACKAGES=(awesome)
START="awesome"

# stock_config <rootfs>: awesome's default rc.lua, plus the 42 lock.
stock_config() {
    local dst=$HOME/.config/awesome/rc.lua
    [[ -e $dst ]] && return 0
    mkdir -p "$(dirname "$dst")"
    sed 's/^terminal = "xterm"/terminal = "x-terminal-emulator"/' "$1/etc/xdg/awesome/rc.lua" >"$dst"
    cat >>"$dst" <<'LUA'

-- 42 lock screen
root.keys(gears.table.join(root.keys(),
    awful.key({ "Control", "Mod1" }, "l", function() awful.spawn("ft_lock") end,
        { description = "lock screen", group = "42" })))
LUA
}

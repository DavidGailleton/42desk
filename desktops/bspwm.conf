# shellcheck shell=bash disable=SC2034
NAME="bspwm"
DESC="tiling window manager driven by sxhkd keybindings"
PACKAGES=(bspwm sxhkd)
START="bspwm"

# stock_config <rootfs>: bspwm's example bspwmrc and sxhkdrc, plus the 42 lock.
stock_config() {
    local ex=$1/usr/share/doc/bspwm/examples
    if [[ ! -e $HOME/.config/bspwm/bspwmrc ]]; then
        install -D -m 755 "$ex/bspwmrc" "$HOME/.config/bspwm/bspwmrc"
    fi
    if [[ ! -e $HOME/.config/sxhkd/sxhkdrc ]]; then
        mkdir -p "$HOME/.config/sxhkd"
        sed 's/\burxvt\b/x-terminal-emulator/' "$ex/sxhkdrc" >"$HOME/.config/sxhkd/sxhkdrc"
        printf '\n# 42 lock screen, back to GNOME\nctrl + alt + l\n\tft_lock\nsuper + b\n\tbspc quit\n' >>"$HOME/.config/sxhkd/sxhkdrc"
    fi
}

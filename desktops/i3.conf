# shellcheck shell=bash disable=SC2034
NAME="i3"
DESC="tiling window manager, simple and reliable"
PACKAGES=(i3-wm i3status)
START="i3"

# stock_config <rootfs>: i3's default config, with the 42 lock instead of i3lock,
# plus the 42desk keys on Super (the stock mod is Alt).
stock_config() {
    local dst=$HOME/.config/i3/config
    [[ -e $dst ]] && return 0
    mkdir -p "$(dirname "$dst")"
    sed 's/^\(exec .*xss-lock.*\)$/# 42: locking goes through ft_lock (below)\n# \1/' "$1/etc/i3/config" >"$dst"
    cat >>"$dst" <<'EOF'

# 42 lock screen, back to GNOME, app search, next keyboard layout
bindsym Ctrl+Mod1+l exec --no-startup-id ft_lock
bindsym Mod4+b exec --no-startup-id 42desk-gnome
bindsym Mod4+space exec --no-startup-id rofi -show drun
bindsym Mod4+Shift+space exec --no-startup-id 42desk-kbd-next
EOF
}

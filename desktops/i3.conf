# shellcheck shell=bash disable=SC2034
NAME="i3"
DESC="tiling window manager, simple and reliable"
PACKAGES=(i3-wm i3status)
START="i3"

# stock_config <rootfs>: i3's default config, with the 42 lock instead of i3lock.
stock_config() {
    local dst=$HOME/.config/i3/config
    [[ -e $dst ]] && return 0
    mkdir -p "$(dirname "$dst")"
    sed 's/^\(exec .*xss-lock.*\)$/# 42: locking goes through ft_lock (below)\n# \1/' "$1/etc/i3/config" >"$dst"
    printf '\n# 42 lock screen\nbindsym Ctrl+Mod1+l exec --no-startup-id ft_lock\n' >>"$dst"
}

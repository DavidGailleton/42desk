# shellcheck shell=bash disable=SC2034
NAME="XFCE"
DESC="full desktop: panel, settings, file manager"
PACKAGES=(exo garcon thunar thunar-volman tumbler xfce4-appfinder xfce4-panel
    xfce4-power-manager xfce4-session xfce4-settings xfce4-terminal xfconf xfdesktop xfwm4)
START="startxfce4"

# stock_config <rootfs>: default XFCE, with xflock4 (Ctrl+Alt+L) using the 42 lock.
stock_config() {
    local dst=$HOME/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-session.xml
    [[ -e $dst ]] && return 0
    mkdir -p "$(dirname "$dst")"
    cat >"$dst" <<'XML'
<?xml version="1.0" encoding="UTF-8"?>

<channel name="xfce4-session" version="1.0">
  <property name="general" type="empty">
    <property name="LockCommand" type="string" value="ft_lock"/>
  </property>
</channel>
XML
}
